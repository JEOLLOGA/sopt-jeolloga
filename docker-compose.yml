version: '3.8'

services:
  spring:
    build:
      context: .
    container_name: spring
    restart: always
    env_file:
      - .env
    networks:
      - templenet

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - spring
    networks:
      - templenet

  redis:
    image: redis:7.2
    container_name: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    networks:
      - templenet

networks:
  templenet:
    driver: bridge
